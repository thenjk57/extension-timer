<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <circle cx="6.5" cy="17.5" r="3.5"></circle>
          <polyline points="6.5 15.5 6.5 17.5 8 18.5"></polyline>
        </svg>
        <span class="app-title">Extensions</span>
        <span class="badge" id="total-count">0</span>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="ext-search" placeholder="Search..." autocomplete="off" spellcheck="false">
      </div>
    </header>

    <!-- Active Timers Bar (Only visible when timers run) -->
    <div id="active-timers-bar" class="active-timers-bar" style="display: none;">
      <div class="active-timers-header">
        <span class="active-title">
          <span class="pulse-dot"></span>
          Active Timers
        </span>
      </div>
      <div id="active-timers-list" class="active-timers-list"></div>
    </div>

    <!-- Main Extension List -->
    <main class="extension-list-container">
      <div id="extensions-list" class="extension-list">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Global status toast -->
    <div id="status-toast" class="status-toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
